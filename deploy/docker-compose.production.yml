services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ../backend
    expose: ["8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://${DOMAIN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_WEB_RISK_API_KEY: ${GOOGLE_WEB_RISK_API_KEY}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY}
      REQUIRE_EGRESS_PROXY: "${REQUIRE_EGRESS_PROXY:-true}"
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL}
      TRUST_PROXY: "true"
      RATE_LIMIT_FAIL_OPEN: "false"
      SCAN_RATE_LIMIT: "${SCAN_RATE_LIMIT:-10}"
      SCAN_RATE_WINDOW_SECONDS: "${SCAN_RATE_WINDOW_SECONDS:-60}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-16384}"
      MAX_URL_LENGTH: "${MAX_URL_LENGTH:-4096}"
      MAX_SCAN_TIMEOUT_SECONDS: "${MAX_SCAN_TIMEOUT_SECONDS:-180}"
      MAX_CONCURRENT_SCANS: "${MAX_CONCURRENT_SCANS:-2}"
      API_KEYS: ${API_KEYS}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: ../backend
    command: sh -c "celery -A app.worker.celery worker --loglevel=INFO --concurrency=$${MAX_CONCURRENT_SCANS:-2} --max-tasks-per-child=50"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_WEB_RISK_API_KEY: ${GOOGLE_WEB_RISK_API_KEY}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY}
      REQUIRE_EGRESS_PROXY: "${REQUIRE_EGRESS_PROXY:-true}"
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL}
      MAX_SCAN_TIMEOUT_SECONDS: "${MAX_SCAN_TIMEOUT_SECONDS:-180}"
      MAX_CONCURRENT_SCANS: "${MAX_CONCURRENT_SCANS:-2}"
      API_KEYS: ${API_KEYS}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build: ../frontend
    expose: ["3000"]
    environment:
      BACKEND_API_URL: http://backend:8000
      BACKEND_API_KEY: ${API_KEYS}
    depends_on: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
