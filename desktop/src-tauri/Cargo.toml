[package]
name = "dp-hellas-check-my-link"
version = "1.0.0"
description = "DP Hellas Check My Link Windows security client"
authors = ["DP Hellas"]
edition = "2021"

[lib]
name = "dp_hellas_check_my_link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-shell = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
