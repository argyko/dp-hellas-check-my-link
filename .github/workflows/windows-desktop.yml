name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/icons/app.png

      - name: Build Windows application
        run: npm run tauri:build
        env:
          VITE_CHECK_MY_LINK_DESKTOP_API: ${{ vars.CHECK_MY_LINK_DESKTOP_API }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: dp-hellas-check-my-link-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
